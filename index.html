<!doctype html><html lang="zh-Hant-TW"><head><meta http-equiv="Cache-Control" content="no-cache"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>每日日文練習</title>
<style>body{font-family:system-ui,"PingFang TC","Noto Sans TC",sans-serif;max-width:560px;margin:auto;padding:14px;background:#f5f7fb;color:#222}
.card{background:#fff;border-radius:14px;padding:16px;box-shadow:0 2px 8px #0001;margin-bottom:12px}
button{display:block;width:100%;padding:14px;margin:8px 0;border:1px solid #ccd;border-radius:10px;background:#fff;font-size:16px;text-align:left}
.ok{background:#d9f7e3;border-color:#2a8}.bad{background:#fde0e0;border-color:#d44}.main{background:#3b6fe0;color:#fff;text-align:center}
.bar{height:10px;background:#e3e7f0;border-radius:5px}.bar div{height:100%;background:#3b6fe0;border-radius:5px;transition:.3s}
nav{display:flex;gap:6px}nav button{text-align:center;padding:10px;font-size:14px}.tag{font-size:12px;background:#ffe9b3;padding:2px 6px;border-radius:6px}
.ex{background:#f0f4ff;padding:10px;border-radius:8px;margin-top:8px}h2{margin:.3em 0}.sp{display:inline-block;width:auto;padding:4px 8px;margin:2px;font-size:15px;text-align:center}.opt{display:flex;align-items:center;gap:4px}.opt>button:first-child{flex:1}.sent{cursor:pointer;border-bottom:1px dashed #99a}.sent:active{background:#ffe9b3}</style></head><body>
<nav><button onclick="startQuiz()">今日練習</button><button onclick="showList('wrong')">錯題本</button><button onclick="showList('mastered')">已通過</button></nav>
<div id="app" class="card">載入中…</div>
<script>

let VO=null;const SU='speechSynthesis' in window;
function pickV(){const v=speechSynthesis.getVoices();VO=v.find(x=>/ja[-_]JP/i.test(x.lang)&&/Kyoko|Google|Otoya/.test(x.name))||v.find(x=>/^ja/i.test(x.lang))||null}
if(SU){pickV();speechSynthesis.onvoiceschanged=pickV}
const TX=[];const tid=t=>{TX.push(t.replace(/^phrase:/,'').replace(/_+/g,'blank'));return TX.length-1};
function say(n,slow,ev){if(ev)ev.stopPropagation();if(!SU){alert('此瀏覽器不支援語音朗讀，請使用 iPhone Safari 或 Android Chrome，並確認已安裝日文語音。');return}
 speechSynthesis.cancel();if(!VO)pickV();const u=new SpeechSynthesisUtterance(TX[n]);u.lang='ja-JP';if(VO)u.voice=VO;u.rate=slow?0.5:0.8;speechSynthesis.speak(u)}
const spk=t=>{const n=tid(t);return `<button class="sp" onclick="say(${n},0,event)">🔊</button><button class="sp" onclick="say(${n},1,event)">🐢</button>`};

const K='japaneseDailyState_v1';let S=JSON.parse(localStorage.getItem(K)||'{"wrong":{},"mastered":{}}');const save=()=>localStorage.setItem(K,JSON.stringify(S));
let day,qs=[],i=0,score=0,answered=false;const $=id=>document.getElementById(id),app=$('app');
const today=new Date(Date.now()+8*36e5).toISOString().slice(0,10);
function shuffle(a){for(let j=a.length-1;j>0;j--){const k=Math.random()*(j+1)|0;[a[j],a[k]]=[a[k],a[j]]}return a}
async function load(){const m=await (await fetch('questions/manifest.json?v='+Date.now(),{cache:'no-store'})).json();const ds=m.days.filter(d=>d.slice(0,10)<=today).sort();day=ds.length?ds[ds.length-1]:m.days[0];return (await (await fetch(`questions/${day}.json?v=${Date.now()}`,{cache:'no-store'})).json()).questions}
async function startQuiz(){app.innerHTML='載入中…';try{const base=await load();const ids=new Set(base.map(q=>q.id));
 const rev=shuffle(Object.values(S.wrong).filter(w=>!ids.has(w.q.id)&&w.last!==today)).slice(0,5).map(w=>({...w.q,review:true}));
 qs=shuffle(base.concat(rev)).slice(0,10);if(rev.length){const keep=new Set(qs.map(q=>q.id));const miss=rev.filter(r=>!keep.has(r.id));}
 qs=shuffle([...rev,...shuffle(base).slice(0,10-rev.length)]);i=0;score=0;const dn=(S.done||{})[day];if(dn){app.innerHTML=`<h2>題組 ${day} 已完成</h2><p>上次得分 ${dn} / 100</p><button class="main" onclick="render()">再練一次</button><button onclick="showList('wrong')">複習錯題本</button>`;return}render()}catch(e){app.innerHTML='題目載入失敗，請檢查網路後<button class="main" onclick="startQuiz()">重新載入</button>'}}
function render(){TX.length=0;answered=false;const q=qs[i],w=S.wrong[q.id];
 const t={kana:'這個假名怎麼念？',romaji:'選出正確的假名',listen:'聽發音，選出正確的假名（可按 🐢 慢速）',meaning:'選出正確的中文意思',grammar:'選出適合填入空格的助詞／文法',reading:'閱讀短文後作答'}[q.type]||'';const JP=/[\u3040-\u30ff\u4e00-\u9fff]/;
 app.innerHTML=`<div>第 ${i+1}/${qs.length} 題　｜　得分 ${score}</div><div class="bar"><div style="width:${i/qs.length*100}%"></div></div>
 <p>${t} ${q.review?`<span class="tag">複習 ${w?w.streak:0}/3</span>`:''}</p><div style="font-size:12px;color:#888">題組 ${day}</div><h2>${q.type=='listen'?'🎧':q.prompt}</h2>${q.type=='listen'||!JP.test(q.prompt)?spk(q.audio||q.word):spk(q.audio||q.prompt)}`+
 q.options.map((o,k)=>`<div class="opt"><button id="o${k}" onclick="pick(${k})">${String.fromCharCode(65+k)}. ${o}</button>${q.type!='listen'&&q.type!='romaji'&&JP.test(o)?spk(o):''}</div>`).join('')+'<div id="fb"></div>'}
function pick(k){if(answered)return;answered=true;const q=qs[i],ok=k==q.answer;$('o'+q.answer).classList.add('ok');if(!ok)$('o'+k).classList.add('bad');
 let msg='';const w=S.wrong[q.id];
 if(w){if(w.last===today)msg=ok?'（今天已複習過此題，明天再計次）':'';else{w.last=today;if(ok){w.streak++;if(w.streak>=3){S.mastered[q.id]={q,date:today};delete S.wrong[q.id];msg='🎉 已在 3 個不同日子答對，通過！'}else msg=`複習進度 ${w.streak}/3（每天最多計 1 次）`}else{w.streak=0;msg='複習答錯，進度歸零 0/3'}}}
 else if(!ok){S.wrong[q.id]={q,streak:0,date:today,last:today};msg='已加入錯題本（需在 3 個不同日子答對才通過）'}
 if(ok)score+=100/qs.length;save();
 $('fb').innerHTML=`<p>${ok?'✅ 答對了！':'❌ 答錯了'} ${msg}</p><div class="ex">📝 ${q.example} ${spk(q.example)}<br>${q.reading?`<small>${q.reading}</small><br>`:''}${q.note?`💡 ${q.note}<br>`:''}${q.exampleZh}</div><button class="main" onclick="next()">${i+1<qs.length?'下一題':'看結果'}</button>`}
function next(){i++;if(i<qs.length)return render();S.done=S.done||{};S.done[day]=Math.round(score);save();app.innerHTML=`<h2>完成！得分 ${Math.round(score)} / 100</h2><p>題組日期：${day}</p><p>錯題本：${Object.keys(S.wrong).length} 題｜已通過：${Object.keys(S.mastered).length} 題</p><button class="main" onclick="startQuiz()">再練一次</button>`}
function showList(t){const L=Object.values(S[t]);app.innerHTML=`<h2>${t=='wrong'?'錯題本':'已通過'}（${L.length}）</h2>`+(L.length?L.map(w=>`<div class="ex"><b>${w.q.word.replace('phrase:','')}</b> ${spk(w.q.word)} — ${w.q.options[w.q.answer]} ${t=='wrong'?`<span class="tag">${w.streak}/3</span>`:''}<br>${w.q.example} ${spk(w.q.example)}<br>${w.q.exampleZh}</div>`).join(''):'<p>目前沒有題目</p>')}
startQuiz();
</script></body></html>
